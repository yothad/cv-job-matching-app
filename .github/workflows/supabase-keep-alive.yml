name: Supabase Keep Alive

# The free Supabase project is paused after 7 days without activity. The
# collect-and-score pipeline writes to it twice a week, but that is a side
# step behind Playwright and Gemini (and silently skips when the secrets are
# missing), so a broken pipeline would let the project lapse. This is the
# independent guarantee: one tiny REST read, twice a week, offset from the
# pipeline's Mon/Thu runs so the longest gap is 4 days.
#
# Unlike keep-warm, this one goes red on failure - a paused project breaks the
# webapp, so a missed ping should be noticed.
#
# Needs repo secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (same as the
# pipeline).

on:
  schedule:
    - cron: '0 6 * * 2'   # Tuesday 06:00 UTC
    - cron: '0 6 * * 6'   # Saturday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from positions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/positions?select=apply_url&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "GET /rest/v1/positions -> $code"
          [ "$code" = "200" ]
