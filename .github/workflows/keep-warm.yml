name: Keep Backend Warm

# Pings the webapp backend's unauthenticated GET /health so the Render instance
# does not spin down (free tier sleeps after ~15 min idle, then takes 30-60s to
# wake). That wake-up is what users see as a long skeleton on a cold visit.
#
# Config: set the repo VARIABLE (not secret) `BACKEND_URL` to the backend base
# URL, e.g. https://<service>.onrender.com (no trailing /health). Settings ->
# Secrets and variables -> Actions -> Variables. While it is unset this
# workflow is a green no-op.
#
# Cadence tradeoff: every 10 min, only 03:00-20:59 UTC = roughly 06:00-23:00
# Israel time in summer (05:00-22:00 in winter). Overnight warmth has little
# value and would burn free-tier instance-hours (~560 h/month this way vs 744
# for 24/7). Keep-warm cuts cold starts but cannot guarantee zero: deploys,
# Render recycling, GitHub's often-delayed cron, and the overnight window still
# hit a cold instance - the frontend SWR cache covers those repeat visits.
#
# A missed ping is fine: every failure path exits 0 so this never pages anyone.

on:
  schedule:
    - cron: '*/10 3-20 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repo variable is not set - skipping ping."
            exit 0
          fi
          url="${BACKEND_URL%/}/health"
          # --max-time covers a cold wake-up; a failure is only a warning.
          if code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 5 "$url"); then
            echo "GET /health -> $code"
          else
            echo "::warning::Keep-warm ping failed (curl exit $?)"
          fi
          exit 0
