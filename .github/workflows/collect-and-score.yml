name: Collect and Score Jobs

on:
  schedule:
    - cron: '0 7 * * 1'   # Monday 07:00 UTC
    - cron: '0 7 * * 4'   # Thursday 07:00 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Collect jobs
        run: uv run python collect_jobs.py

      - name: Sync shared positions catalog to Supabase
        # The webapp catalog is a side output - a Supabase outage (e.g. a paused
        # project) must never block scoring below.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python scripts/sync_positions.py

      - name: Score jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python score.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profiles/*/digest.md profiles/*/scored_jobs.json profiles/*/all_scores.jsonl companies.json
          git diff --cached --quiet || git commit -m "chore: auto collect+score $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main && git push
