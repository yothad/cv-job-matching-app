name: Refresh Companies

on:
  schedule:
    - cron: '0 6 * * 0'   # Every Sunday 06:00 UTC (GitHub doesn't support /14 for bi-weekly)
  workflow_dispatch:

# Shared with refresh-companies.yml / collect-and-score.yml: both commit companies.json, so
# overlapping runs conflict on push. Queue instead of cancelling an in-flight run.
concurrency:
  group: companies-json-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04  # pinned: Playwright --with-deps does not support the Ubuntu 26 image ubuntu-latest moved to on 2026-10-19
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Refresh companies
        run: uv run python refresh_companies.py

      - name: Commit updated companies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json
          git diff --cached --quiet || git commit -m "chore: auto refresh companies $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main && git push
